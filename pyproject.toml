[project]
name = "tunisia-drought-monitoring"
version = "0.1.0"
description = "Suivi mensuel de l'occupation des sols et de la sécheresse en Tunisie par imagerie satellite."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "earthengine-api>=1.7.48",
    "geopandas>=1.2.0",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tdm"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
